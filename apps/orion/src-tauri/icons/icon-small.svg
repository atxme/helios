<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="sky" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#16394A"/>
      <stop offset="52%" stop-color="#0D2231"/>
      <stop offset="100%" stop-color="#060F17"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12B981"/>
      <stop offset="100%" stop-color="#48E7B4"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#sky)"/>

  <!-- Small-size variant: the containment ring, the constellation lines and the
       outlying stars all fall below one pixel at 16 px and turn to mud. What
       survives is the orbit and the belt, so only those are drawn — thicker,
       and larger than in the full mark. Same figure, fewer strokes. -->
  <g transform="translate(256 256) scale(9.2) translate(-24 -24)">
    <ellipse cx="24" cy="24" rx="19.5" ry="7.6" transform="rotate(27 24 24)"
             fill="none" stroke="url(#orbit)" stroke-width="3.2"/>
    <g fill="#FFFFFF">
      <circle cx="14.6" cy="31.2" r="3.4"/>
      <circle cx="33.4" cy="16.8" r="3.4"/>
      <circle cx="24" cy="24" r="6.6"/>
    </g>
  </g>
</svg>
