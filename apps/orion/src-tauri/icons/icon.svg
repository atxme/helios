<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Night sky, lit from the belt outward. -->
    <radialGradient id="sky" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#16394A"/>
      <stop offset="52%" stop-color="#0D2231"/>
      <stop offset="100%" stop-color="#060F17"/>
    </radialGradient>

    <!-- Glow carried by the central star. -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#12B981" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#12B981" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#12B981" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="orbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12B981"/>
      <stop offset="100%" stop-color="#3FE0AC"/>
    </linearGradient>

    <!-- Top edge light, so the tile does not read as flat. -->
    <linearGradient id="bevel" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Squircle tile. 96 of radius is the Windows 11 idiom. -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#sky)"/>
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bevel)"/>

  <!-- The mark, on the same 48-unit grid as `OrionMark.tsx`, inset in the tile. -->
  <g transform="translate(256 256) scale(8.6) translate(-24 -24)">
    <!-- Containment ring: the grammar shared with the Helios mark. -->
    <circle cx="24" cy="24" r="22.25" fill="none" stroke="#EAF7F1" stroke-opacity="0.20" stroke-width="0.9"/>

    <!-- Glow behind the belt. -->
    <circle cx="24" cy="24" r="16" fill="url(#halo)"/>

    <!-- Elliptical trajectory, tilted +27° — mirror of the Helios mark. -->
    <ellipse cx="24" cy="24" rx="20.5" ry="7.25" transform="rotate(27 24 24)"
             fill="none" stroke="url(#orbit)" stroke-width="1.7" stroke-opacity="0.92"/>

    <!-- Constellation lines, faint as on a star chart. -->
    <g stroke="#EAF7F1" stroke-width="1.0" stroke-opacity="0.38" stroke-linecap="round">
      <line x1="15.5" y1="30.5" x2="32.5" y2="17.5"/>
      <line x1="13.25" y1="16.5" x2="24" y2="24"/>
      <line x1="34.75" y1="31.5" x2="24" y2="24"/>
    </g>

    <!-- Stars. The belt is what still reads at 16 px. -->
    <g fill="#EAF7F1">
      <circle cx="13.25" cy="16.5" r="1.5" fill-opacity="0.6"/>
      <circle cx="34.75" cy="31.5" r="1.5" fill-opacity="0.6"/>
      <circle cx="15.5" cy="30.5" r="2.7"/>
      <circle cx="32.5" cy="17.5" r="2.7"/>
    </g>
    <!-- Central star: the solid centre, tinted so the accent is present even
         when the orbit is too thin to survive downscaling. -->
    <circle cx="24" cy="24" r="5.4" fill="#FFFFFF"/>
    <circle cx="24" cy="24" r="5.4" fill="url(#halo)"/>
  </g>
</svg>
