[package]
name = "orion"
version = "2.78.8"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Client VPN Orion — IHM web embarquée (Tauri) pilotant le backend WireGuard."

[[bin]]
name = "orion"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
xtask = { path = "../../../tools/xtask" }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "=2.5.2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
aether = { workspace = true }
astra-operator.workspace = true
aether-fido.workspace = true
orion-core = { path = "../../../crates/orion-core" }
orion-engine = { path = "../../../crates/orion-engine" }
# `StagedKey` tient une clé privée entre sa création et son enregistrement :
# elle doit être effacée au `Drop`, pas seulement libérée (ADR-006 §5).
zeroize = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# Vérification d'élévation avant tout lancement (`launch`) : jeton de l'IHM,
# GetTokenInformation(TokenElevation), et drapeau de console du terminal SSH.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  # Octroi aux Administrateurs sur le processus et le jeton de l'IHM avant
  # l'élévation (`ui_access`) : GetSecurityInfo, SetEntriesInAclW, SetSecurityInfo.
  "Win32_Security_Authorization",
  # Appartement COM du fil de la boîte de choix du coffre (`operator::location`).
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  # Lancement élevé du moteur (`engine_launch`) : ShellExecuteExW est gardé par
  # `Win32_System_Registry` dans windows-sys 0.61.
  "Win32_System_Registry",
  # Choix de l'emplacement du coffre opérateur (`operator::location`) : GetSaveFileNameW.
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
default = []
# Relais de la feature du backend WireGuard réel vers orion-core (target-only).
wireguard = ["orion-core/wireguard"]
