[package]
name = "orion"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Client VPN Orion — IHM web embarquée (Tauri) pilotant le backend WireGuard."

[[bin]]
name = "orion"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
aether = { workspace = true }
orion-core = { path = "../../../crates/orion-core" }

[features]
default = []
# Relais de la feature du backend WireGuard réel vers orion-core (target-only).
wireguard = ["orion-core/wireguard"]
