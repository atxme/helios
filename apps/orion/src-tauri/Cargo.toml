[package]
name = "orion"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Client VPN Orion — IHM web embarquée (Tauri) pilotant la pile IKEv2 native de l'OS."

[[bin]]
name = "orion"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
aether = { workspace = true }
orion-core = { path = "../../../crates/orion-core" }

[features]
default = []
# Relais des features de pile IKEv2 réelle vers orion-core (target-only).
linux-strongswan = ["orion-core/linux-strongswan"]
native-windows = ["orion-core/native-windows"]
native-macos = ["orion-core/native-macos"]
