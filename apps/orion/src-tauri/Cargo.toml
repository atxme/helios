[package]
name = "orion"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Client VPN Orion — IHM web embarquée (Tauri) pilotant le backend WireGuard."

[[bin]]
name = "orion"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "=2.4.3"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
aether = { workspace = true }
orion-core = { path = "../../../crates/orion-core" }
# `StagedKey` tient une clé privée entre sa création et son enregistrement :
# elle doit être effacée au `Drop`, pas seulement libérée (ADR-006 §5).
zeroize = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# Désélévation du terminal SSH (`deelevate`) : jeton lié de l'utilisateur
# standard, puis CreateProcessWithTokenW. Sans ça, un terminal lancé depuis
# Orion hériterait de son jeton Administrateur.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  # `GetShellWindow` : le processus du bureau, dont on emprunte le jeton.
  "Win32_UI_WindowsAndMessaging",
] }

[features]
default = []
# Relais de la feature du backend WireGuard réel vers orion-core (target-only).
wireguard = ["orion-core/wireguard"]
