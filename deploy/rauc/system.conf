# Exemple de configuration RAUC pour l'appliance Helios (image A/B).
# À placer dans /etc/rauc/system.conf sur la cible.
#
# Deux slots rootfs (A/B) + un slot bootloader. RAUC installe dans le slot
# inactif ; le bootloader bascule au reboot et fait un ROLLBACK automatique si le
# nouveau slot ne confirme pas son boot (heliosd appelle `rauc status mark-good`).

[system]
compatible=helios-appliance
bootloader=uboot
mountprefix=/run/rauc
data-directory=/var/lib/helios/rauc

[keyring]
path=/etc/rauc/keyring.pem

[slot.rootfs.0]
device=/dev/disk/by-partlabel/rootfs-a
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/rootfs-b
type=ext4
bootname=B
