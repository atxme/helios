[package]
name = "xtask"
version = "0.4.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Fabrique de bundles d'installation Helios. Ne tourne jamais sur une gateway."
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
helios-update.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
