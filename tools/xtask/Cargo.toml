[package]
name = "xtask"
version = "0.3.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Fabrique de bundles d'installation Helios. Ne tourne jamais sur une gateway."
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
# Empreintes du contenu et lecture du manifeste : le même code que celui qui
# vérifie à l'installation, pour que la fabrique ne puisse pas produire un
# bundle que l'installateur refuserait.
helios-update.workspace = true
aether.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
