[package]
name = "xtask"
version = "2.0.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Fabrique de bundles d'installation Helios. Ne tourne jamais sur une gateway."
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
aether.workspace = true
anyhow.workspace = true
clap.workspace = true
helios-update.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
# Lit la configuration JSON de l'installeur dans un test. Déjà dans le lockfile.
serde_json.workspace = true
# Signe un bundle de test (`PublisherSigner`).
aether = { workspace = true, features = ["publisher-signing"] }
