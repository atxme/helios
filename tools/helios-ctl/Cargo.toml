[package]
name = "helios-ctl"
version = "0.11.0"
edition.workspace = true
authors.workspace = true

[[bin]]
name = "helios-ctl"
path = "src/main.rs"

[dependencies]
aether.workspace = true
helios-update.workspace = true
# Emplacement fixe de la CA opérateur, indépendant du répertoire courant.
directories = "5"
# Séquestre de l'identité de la gateway : la moitié opérateur (génération de la
# paire, ouverture du blob) vit ici, jamais sur la gateway. Sans la feature
# `tpm` : le module `escrow` est de la crypto pure, aucun accès matériel.
helio-tpm.workspace = true
# La campagne agit comme un **vrai** client : elle emprunte le chemin de
# provisioning d'Orion plutôt que de le réimplémenter, sans quoi elle
# validerait sa propre copie du protocole et non le code livré.
orion-core = { workspace = true }
helios-key-negotiation.workspace = true
base64.workspace = true
hex.workspace = true
x25519-dalek.workspace = true
clap.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
rcgen.workspace = true
rustls.workspace = true
time.workspace = true
zeroize.workspace = true
reqwest = { workspace = true }
futures-util = { workspace = true }
tokio-tungstenite = "0.24"
