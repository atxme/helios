[package]
name = "helios"
version = "3.1.2"
edition.workspace = true
authors.workspace = true
default-run = "helios"

[[bin]]
name = "helios"
path = "src/main.rs"

[dependencies]
aether.workspace = true
helios-update.workspace = true
# Emplacement fixe de la CA opérateur, indépendant du répertoire courant.
directories = "6"
# Séquestre de l'identité de la gateway : la moitié opérateur (génération de la
# paire, ouverture du blob) vit ici, jamais sur la gateway.
helios-escrow.workspace = true
helios-tpm.workspace = true
# La campagne agit comme un **vrai** client : elle emprunte le chemin de
# provisioning d'Orion plutôt que de le réimplémenter, sans quoi elle
# validerait sa propre copie du protocole et non le code livré.
orion-core = { workspace = true }
aether-key-negotiation.workspace = true
base64.workspace = true
hex.workspace = true
x25519-dalek.workspace = true
clap.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
thiserror.workspace = true
rcgen.workspace = true
rustls.workspace = true
time.workspace = true
zeroize.workspace = true
reqwest = { workspace = true }
futures-util = { workspace = true }
tokio-tungstenite = "0.30"
rustyline = { version = "18.0.1", default-features = false, features = ["custom-bindings"] }
shlex = "2.0.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
