[package]
name = "astra-signer"
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Compagnon opérateur d'Astra (ADR-008 §4) : ouvre le coffre d'autorité par une clé de sécurité FIDO2, sur le poste où elle est branchée. Ni Astra, ni la gateway, ni un navigateur ne voient jamais CA-PQ."

[lib]
name = "astra_signer"
path = "src/lib.rs"

[[bin]]
name = "astra-signer"
path = "src/main.rs"

[dependencies]
# `key-negotiation-signing` sans condition : sans elle il n'existe aucune
# fonction `sign`, et le compagnon est précisément le seul programme du dépôt
# qui signe sous `CA-PQ`. La construire sans donnerait un binaire qui ouvre le
# coffre et ne peut rien en faire.
aether = { workspace = true, features = ["key-negotiation-signing"] }
astra.workspace = true
helios-fido = { workspace = true }
anyhow.workspace = true
aws-lc-rs.workspace = true
base64.workspace = true
clap.workspace = true
hex.workspace = true
rcgen.workspace = true
# Le transport in-tunnel du §8.1.2. Bloquant : le compagnon est un programme
# de terminal qui attend qu'un humain touche une clé, il n'a pas d'exécuteur
# asynchrone et n'en veut pas un pour trois requêtes.
reqwest = { workspace = true, features = ["blocking"] }
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Les périodes de validité X.509 que `rcgen` attend.
time.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile = "3"
# Le certificat `CA-TLS` que le compagnon auto-signe se relit avec un parseur
# X.509 réel plutôt qu'avec l'émetteur qui vient de l'écrire : c'est la
# signature et le `basicConstraints` qui comptent, pas ce que `rcgen` croit
# avoir posé. Même version que celle qu'`aether` vérifie déjà.
x509-parser = { version = "0.16", features = ["verify"] }
