[package]
name = "astra-signer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Compagnon opérateur d'Astra (ADR-008 §4) : ouvre le coffre d'autorité par une clé de sécurité FIDO2, sur le poste où elle est branchée. Ni Astra, ni la gateway, ni un navigateur ne voient jamais CA-PQ."

[lib]
name = "astra_signer"
path = "src/lib.rs"

[[bin]]
name = "astra-signer"
path = "src/main.rs"

[dependencies]
# `key-negotiation-signing` sans condition : sans elle il n'existe aucune
# fonction `sign`, et le compagnon est précisément le seul programme du dépôt
# qui signe sous `CA-PQ`. La construire sans donnerait un binaire qui ouvre le
# coffre et ne peut rien en faire.
aether = { workspace = true, features = ["key-negotiation-signing"] }
astra.workspace = true
anyhow.workspace = true
aws-lc-rs.workspace = true
base64.workspace = true
clap.workspace = true
hex.workspace = true
rcgen.workspace = true
# Le transport in-tunnel du §8.1.2. Bloquant : le compagnon est un programme
# de terminal qui attend qu'un humain touche une clé, il n'a pas d'exécuteur
# asynchrone et n'en veut pas un pour trois requêtes.
reqwest = { workspace = true, features = ["blocking"] }
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Les périodes de validité X.509 que `rcgen` attend.
time.workspace = true
zeroize.workspace = true
# Pile CTAP2 sur HID, avec l'extension `hmac-secret`. Sans condition : un
# compagnon qui ne parle à aucune clé n'ouvre aucun coffre, et la spécification
# refuse tout autre déverrouillage — le bâtir sans serait indiscernable d'une
# panne. Elle tire `hidapi`, donc `libudev` sous Linux (scripts/setup-dev.sh).
# `aws-lc-rs` plutôt que `ring` : c'est le backend cryptographique du dépôt, et
# deux piles dans un même binaire sont deux surfaces à suivre.
ctap-hid-fido2 = { version = "3.5", default-features = false, features = ["aws-lc-rs"] }

[dev-dependencies]
tempfile = "3"
# Le certificat `CA-TLS` que le compagnon auto-signe se relit avec un parseur
# X.509 réel plutôt qu'avec l'émetteur qui vient de l'écrire : c'est la
# signature et le `basicConstraints` qui comptent, pas ce que `rcgen` croit
# avoir posé. Même version que celle qu'`aether` vérifie déjà.
x509-parser = { version = "0.16", features = ["verify"] }

# API WebAuthn de Windows, générée depuis les métadonnées Microsoft : aucune
# déclaration FFI écrite à la main. C'est le chemin qui n'exige pas
# d'élévation — et celui où le PIN est collecté par le système, donc n'entre
# jamais dans ce processus.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WindowsWebServices",
    "Win32_System_Console",
] }
