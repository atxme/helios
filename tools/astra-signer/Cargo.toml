[package]
name = "astra-signer"
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Adaptateur en ligne de commande de la bibliothèque opérateur d'Astra. Conservé le temps de la migration vers Orion : l'ADR-008 §4 exige encore un compagnon portable et un transport hors ligne."

[[bin]]
name = "astra-signer"
path = "src/main.rs"

[dependencies]
# Tout ce qui ouvre un coffre ou signe vit dans `astra-operator`. Ce binaire
# n'est plus que des invites et des chemins de fichiers.
astra-operator.workspace = true
# `key-negotiation-signing` sans condition : les types signés traversent cette
# interface, et sans la fonctionnalité ils n'existent pas.
aether = { workspace = true, features = ["key-negotiation-signing"] }
astra.workspace = true
helios-fido = { workspace = true }
anyhow.workspace = true
aws-lc-rs.workspace = true
base64.workspace = true
clap.workspace = true
hex.workspace = true
rcgen.workspace = true
# Le transport in-tunnel du §8.1.2. Bloquant : le compagnon est un programme
# de terminal qui attend qu'un humain touche une clé, il n'a pas d'exécuteur
# asynchrone et n'en veut pas un pour trois requêtes.
reqwest = { workspace = true, features = ["blocking"] }
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Les périodes de validité X.509 que `rcgen` attend.
time.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile = "3"
# Le certificat `CA-TLS` que le compagnon auto-signe se relit avec un parseur
# X.509 réel plutôt qu'avec l'émetteur qui vient de l'écrire : c'est la
# signature et le `basicConstraints` qui comptent, pas ce que `rcgen` croit
# avoir posé. Même version que celle qu'`aether` vérifie déjà.
x509-parser = { version = "0.16", features = ["verify"] }
