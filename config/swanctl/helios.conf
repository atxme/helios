# Exemple de configuration strongSwan (swanctl) côté machine dédiée.
# heliosd peut charger les connexions dynamiquement via VICI, mais ce fichier
# documente l'équivalent statique et sert de référence pour les propositions.
#
# Échange de clés HYBRIDE post-quantique (IKEv2, RFC 9370 « multiple key
# exchanges ») : ECDHE classique (ecp384) + ML-KEM-768 en échange additionnel.
# Nécessite strongSwan >= 6.0 avec les plugins d'échange post-quantique
# (ex. `ml`/`oqs` selon la build).

connections {
    site-a {
        version = 2
        remote_addrs = 203.0.113.10
        proposals = aes256gcm16-prfsha384-ecp384-ke1_mlkem768

        local {
            auth = pubkey
            id = client@helios
            certs = client.pem
        }
        remote {
            auth = pubkey
            id = gw@example.net
        }

        children {
            site-a {
                esp_proposals = aes256gcm16-ecp384
                start_action = trap
                # Le kill-switch nftables (géré par heliosd) double cette policy :
                # rien ne sort en clair si la SA n'est pas montée.
            }
        }
    }
}
