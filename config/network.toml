# Configuration réseau Helios (gateway WireGuard) — chargeable via :
#   cargo run -p helios-ctl -- network load config/network.toml
# ou via POST /api/network (JSON).
#
# Tous les autres paramètres sont compilés dans le binaire :
#   - TPM : /dev/tpmrm0, PCR sha256 [0,4,7], /var/lib/helios/sealed.key
#   - API : 127.0.0.1:8080
#   - Pare-feu : fail-closed (invariant de sécurité)

wan_iface = "eth0"
lan_ifaces = ["eth1"]

# ── Plan de données WireGuard ────────────────────────────────────────────────
# La gateway est un SERVEUR : elle écoute, les clients Orion s'y connectent.

# Nom de l'interface créée par heliosd.
wg_iface = "helios0"

# Clé privée Curve25519 de la gateway, en base64. **SECRET.**
#
# DÉPRÉCIÉ en production (ADR-004 §3). L'identité de la gateway se crée sur la
# gateway, scellée dans le TPM, sans jamais toucher le disque en clair :
#
#   sudo heliosd provision-tpm     # une seule fois, premier déploiement
#   sudo heliosd init-identity     # affiche la clé PUBLIQUE à donner aux clients
#
# Ce champ ne subsiste que pour deux cas : les gateways déjà installées, et les
# campagnes automatisées qui fabriquent une configuration jetable sans TPM. Une
# clé laissée ici est lue avec avertissement, scellée au démarrage suivant, et
# doit ensuite être retirée : en clair sur disque, elle suffit à usurper la
# gateway.
wg_private_key = ""

# Adresse de la gateway dans le tunnel. Plage CGNAT RFC 6598 (ADR-001 §4) : elle
# évite les collisions avec les box résidentielles (192.168/16) et les réseaux
# d'entreprise (10/8).
wg_address = "100.64.0.1/10"

# Port UDP d'écoute. C'est la seule ouverture entrante du modèle fail-closed.
wg_listen_port = 51820

# Port UDP public de key-nego (QUIC + PKI). Il doit être redirigé séparément
# par la box vers cette gateway. Le laisser absent garde le port fermé lorsque
# heliosd n'est pas compilé avec la feature `key-negotiation`.
# key_negotiation_port = 51821

# L'API web vit DERRIÈRE le tunnel : on la restreint à l'interface WireGuard.
admin_iface = "helios0"

# ── Séquestre de l'identité (reprise après changement de PCR) ────────────────
# La clé privée ci-dessus est scellée par le TPM contre PCR 0/4/7 (firmware,
# chaîne de démarrage, Secure Boot). Un nouveau kernel, bootloader ou firmware
# déplace ces PCR : le secret est régénéré et la clé devient irrécupérable.
# (Remplacer le seul binaire `heliosd` ne change RIEN — le rootfs n'est pas
# mesuré dans ces PCR.)
#
# Le séquestre couvre ce cas SANS accès SSH : la gateway écrit une copie de sa
# clé chiffrée vers la clé publique ci-dessous. Seul l'opérateur, qui détient la
# moitié privée gardée HORS de la gateway, peut l'ouvrir.
#
# Reprise après changement de PCR :
#   1. récupérer /var/lib/helios/wg-key.escrow
#   2. l'ouvrir hors ligne avec la clé privée d'opérateur
#   3. déposer la clé retrouvée dans /var/lib/helios/wg-key.recovery
#      (livré avec le bundle OTA, comme le billet de rescellement)
#   4. redémarrer : la gateway rescelle la clé et efface le fichier
#
# Absente = pas de filet : la clé serait définitivement perdue.
#
# Générer la paire sur le poste opérateur, jamais sur la gateway :
#   helios-ctl escrow keygen --output-dir ~/helios-escrow
# puis, le jour où il faut s'en servir :
#   helios-ctl escrow open --escrow wg-key.escrow \
#     --private-key ~/helios-escrow/escrow-private.key --output wg-key.recovery
# escrow_public_key = "<clé publique X25519 de l'opérateur, base64>"

# Optionnel : SSH d'administration autorisé même kill-switch engagé.
# allow_ssh_from = ["10.0.0.0/8"]

# ── Adresse du WAN obtenue par bail DHCP ─────────────────────────────────────
# Le kill-switch n'ouvre pas DHCP par défaut : une gateway a normalement une
# adresse fixe, et l'ouvrir sans raison élargirait le fail-closed pour rien.
#
# Mais une gateway placée derrière une box tient souvent son adresse d'un bail.
# Sans cette ligne, elle la perd au premier renouvellement — donc son tunnel ET
# son administration à la fois, plusieurs heures après un démarrage qui semblait
# réussi. Vérifier avec :  ip -4 addr show <wan_iface> | grep dynamic
#
# L'ouverture reste scopée : UDP 67 en sortie et 68 en entrée, sur la seule
# interface WAN, et jamais en traversée.
# allow_dhcp_on_wan = true

# ── Sortie Internet des clients du tunnel ────────────────────────────────────
# Fermé par défaut. Sans cette ligne, un client connecté atteint la gateway et
# son API, rien de plus : c'est une gateway d'accès à des ressources internes.
# Avec, il navigue par la gateway — ce qu'on attend d'un VPN grand public.
#
# Ce que ça pose : forward `wg_iface -> wan_iface` et masquerade en
# postrouting, uniquement dans un état où le trafic est autorisé. Le NAT tombe
# avec le tunnel ; il ne survit jamais au kill-switch.
#
# Deux prérequis, sinon le tunnel monte et ne route rien :
#   sysctl -w net.ipv4.ip_forward=1     # à rendre permanent dans /etc/sysctl.d/
#   AllowedIPs = 0.0.0.0/0              # côté client, sinon il ne route rien
#
# Limite : le DNS n'est PAS tunnelé. Le client garde son résolveur, donc ses
# requêtes sortent hors du tunnel et révèlent les noms consultés.
# allow_client_internet = true

# ── Pairs autorisés ──────────────────────────────────────────────────────────
# Ne plus éditer cette liste à la main : l'admission dérive la VIP de la clé
# publique (ADR-004 §5), et une adresse choisie au jugé crée une seconde vérité.
#
#   sudo heliosd peer add --name poste --public-key <clé> --admin  # console
#   helios-ctl peer add --name poste --public-key <clé>            # dans le tunnel
#
# Puis émettre le profil client :
#   helios-ctl profile emit --name poste --endpoint vpn.example.net:51820 \
#     --public-key <clé publique du client> --output poste.json
#
# `address` est la VIP du client : dans WireGuard, AllowedIPs EST la table de
# routage cryptographique — deux pairs ne peuvent pas revendiquer la même.
#
# Les PSK ML-KEM sont éphémères et ne doivent jamais être écrits ici.
# `minimum_key_negotiation_mode = "ml_kem"` interdit une reconnexion classique
# ou statique. Les deux empreintes lient les identités TLS et ML-DSA du client.

# [[peers]]
# name = "poste-christophe"
# public_key = "<clé publique du client, base64>"
# address = "100.64.1.2/32"
# admin = true
# key_negotiation_certificate_sha256 = "<empreinte TLS>"
# key_negotiation_pq_certificate_sha256 = "<empreinte certificat ML-DSA>"
# minimum_key_negotiation_mode = "ml_kem"
