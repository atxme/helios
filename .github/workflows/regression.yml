name: Régression

# La CI valide les composants touchés et leurs dépendants. Les campagnes
# scripts/regression.sh et scripts/coverage.sh restent des validations locales.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  changes:
    name: Sélection des contrôles
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      linux: ${{ steps.plan.outputs.linux }}
      windows: ${{ steps.plan.outputs.windows }}
      aether: ${{ steps.plan.outputs.aether }}
      embed_web: ${{ steps.plan.outputs.embed_web }}
      web: ${{ steps.plan.outputs.web }}
      orion_ui: ${{ steps.plan.outputs.orion_ui }}
      audit: ${{ steps.plan.outputs.audit }}
      checks: ${{ steps.plan.outputs.checks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Composants et dépendants modifiés
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          args=()
          if [ "$EVENT" = pull_request ]; then
            args=(--base "$(git merge-base "$PR_BASE" HEAD)")
          elif [ "$EVENT" = push ] && [[ "$PUSH_BASE" =~ ^[0-9a-f]{40}$ ]] && [[ "$PUSH_BASE" =~ [1-9a-f] ]]; then
            args=(--base "$PUSH_BASE")
          fi
          python3 scripts/ci-plan.py "${args[@]}" --output "$GITHUB_OUTPUT"

  checks:
    name: Format et tests des scripts
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: python3 -m unittest discover -s scripts/tests
        env:
          PYTHONDONTWRITEBYTECODE: 1

  frontend:
    name: Interfaces web
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.orion_ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            apps/orion/package-lock.json
      - name: Console gateway
        if: needs.changes.outputs.web == 'true'
        run: |
          npm ci --prefix web --no-audit --no-fund
          npm run test:unit --prefix web
          npm run build --prefix web
      - name: Interface Orion
        if: needs.changes.outputs.orion_ui == 'true'
        run: |
          npm ci --prefix apps/orion --no-audit --no-fund
          npm run test:unit --prefix apps/orion
          npm run build --prefix apps/orion

  rust-linux:
    name: Rust Linux — composants concernés
    needs: changes
    if: needs.changes.outputs.linux != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PACKAGES: ${{ needs.changes.outputs.linux }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-ci
          cache-on-failure: true
      - name: Dépendances natives Linux (sans WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libtss2-dev libudev-dev libclang-dev
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.embed_web == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Interface embarquée pour les tests API
        if: needs.changes.outputs.embed_web == 'true'
        run: |
          npm ci --prefix web --no-audit --no-fund
          npm run build --prefix web
      - name: Clippy et tests des composants concernés
        run: |
          read -r -a packages <<< "$PACKAGES"
          cargo clippy --locked "${packages[@]}" --all-targets --all-features -- -D warnings
          cargo test --locked "${packages[@]}" --all-features
      - name: Contrat aether sans feature de signature
        if: needs.changes.outputs.aether == 'true'
        run: cargo test --locked -p aether --lib

  orion-windows:
    name: Orion et Astra — sécurité Windows
    needs: changes
    if: needs.changes.outputs.windows != ''
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      PACKAGES: ${{ needs.changes.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-ci
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/orion/package-lock.json
      - name: Dépendances Orion
        run: npm ci --prefix apps/orion --no-audit --no-fund
      - name: Validation des scripts PowerShell Windows
        shell: pwsh
        run: |
          Get-Command .\scripts\deploy-app.ps1 -Syntax | Out-Null
          Get-Command .\scripts\setup-orion-signing.ps1 -Syntax | Out-Null
      - name: Clippy des chemins Windows concernés
        shell: pwsh
        run: |
          $packages = $env:PACKAGES -split ' '
          cargo clippy --locked @packages --all-targets --all-features -- -D warnings
      - name: Tests des chemins Windows concernés
        shell: pwsh
        run: |
          $packages = $env:PACKAGES -split ' '
          cargo test --locked @packages --all-features

  audit:
    name: Audit des dépendances
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: audit
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file Cargo.lock
      - run: npm audit --prefix web --audit-level=moderate
      - run: npm audit --prefix apps/orion --audit-level=moderate
