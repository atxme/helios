name: Régression

# Ce que la campagne garde, c'est `main` : elle tourne donc sur ce qui y entre,
# et pas sur chaque poussée d'une branche de travail. Une campagne complète
# coûte plusieurs minutes d'exécutant, et la jouer à chaque commit intermédiaire
# n'apprend rien que le développeur ne puisse obtenir localement — la référence
# reste `bash scripts/regression.sh`, qui joue exactement les mêmes étapes.
#
# `pull_request` est conservé volontairement : une PR vers `main` est le dernier
# moment où la branche peut être arrêtée avant d'y entrer. La retirer laisserait
# `main` sans filet, ce qui est l'inverse du but.
#
# `workflow_dispatch` reste ouvert à toutes les branches : une campagne à la
# demande sur une branche de travail est possible, elle n'est simplement plus
# automatique.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Tests de non-régression
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            apps/orion/package-lock.json
      - name: Dépendances système de Tauri et TPM
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libtss2-dev
      - name: Audit Rust
        run: cargo install cargo-audit --locked
      - name: Campagne de régression
        run: bash scripts/regression.sh
      - name: Outillage de couverture Rust
        run: cargo install cargo-llvm-cov --locked
      - name: Couverture Linux complète
        run: bash scripts/coverage.sh
      - name: Rapports de couverture Linux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-linux
          path: target/coverage
          if-no-files-found: warn

  orion-windows:
    name: Orion et Astra — sécurité Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/orion/package-lock.json
      - name: Dépendances Orion
        run: npm ci --prefix apps/orion
      - name: Tests et build de l'IHM
        run: |
          npm run test:unit --prefix apps/orion
          npm run build --prefix apps/orion
      - name: Validation du lanceur de mise à jour PowerShell
        shell: pwsh
        run: Get-Command .\scripts\deploy-app.ps1 -Syntax | Out-Null
      - name: Analyse statique des chemins Windows
        run: cargo clippy -p helios-fido -p orion-core -p orion -p astra-signer --all-targets --all-features -- -D warnings
      - name: Tests du compagnon Astra sous Windows
        run: cargo test -p helios-fido -p astra-signer --all-features
      - name: Outillage de couverture Rust
        run: cargo install cargo-llvm-cov --locked
      - name: Tests et couverture Orion sous Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/coverage | Out-Null
          cargo llvm-cov --package orion-core --package orion --all-features --json --output-path target/coverage/orion-windows.json
          cargo llvm-cov report --html --output-dir target/coverage/orion-windows-html
      - name: Rapport de couverture Windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-orion-windows
          path: target/coverage
          if-no-files-found: warn
