name: Régression

# Les pull requests jouent le socle rapide ; `main` et les lancements manuels
# jouent la campagne complète, dont les audits et couvertures coûteux.
# `bash scripts/regression.sh` reste la référence locale de cette campagne.
#
# `workflow_dispatch` reste ouvert à toutes les branches : une campagne à la
# demande sur une branche de travail est possible, elle n'est simplement plus
# automatique.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-check:
    if: github.event_name == 'pull_request'
    name: Vérifications rapides
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Cache Rust standard : registre, dépendances git et artefacts de build.
      # Le toolchain et le job distinguent naturellement Linux et Windows.
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            apps/orion/package-lock.json
      - name: Dépendances système de Tauri et TPM
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libtss2-dev libudev-dev
      - name: Vérifications rapides
        run: bash scripts/check.sh

  regression:
    if: github.event_name != 'pull_request'
    name: Tests de non-régression complets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            apps/orion/package-lock.json
      - name: Dépendances système de Tauri et TPM
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libtss2-dev libudev-dev
      - name: Outil d'audit Rust
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked
          fi
      - name: Campagne de régression
        run: bash scripts/regression.sh
      - name: Outil de couverture Rust
        run: |
          if ! command -v cargo-llvm-cov >/dev/null 2>&1; then
            cargo install cargo-llvm-cov --locked
          fi
      - name: Couverture Linux complète
        run: bash scripts/coverage.sh
      - name: Rapports de couverture Linux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-linux
          path: target/coverage
          if-no-files-found: warn

  orion-windows:
    name: Orion et Astra — sécurité Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/orion/package-lock.json
      - name: Dépendances Orion
        run: npm ci --prefix apps/orion
      - name: Tests et build de l'IHM
        run: |
          npm run test:unit --prefix apps/orion
          npm run build --prefix apps/orion
      - name: Validation du lanceur de mise à jour PowerShell
        shell: pwsh
        run: Get-Command .\scripts\deploy-app.ps1 -Syntax | Out-Null
      - name: Analyse statique des chemins Windows
        run: cargo clippy -p helios-fido -p orion-core -p orion -p astra-signer --all-targets --all-features -- -D warnings
      - name: Tests du compagnon Astra sous Windows
        run: cargo test -p helios-fido -p astra-signer --all-features
      - name: Tests et couverture Orion sous Windows
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          if (-not (Get-Command cargo-llvm-cov -ErrorAction SilentlyContinue)) {
            cargo install cargo-llvm-cov --locked
          }
          New-Item -ItemType Directory -Force target/coverage | Out-Null
          cargo llvm-cov --package orion-core --package orion --all-features --json --output-path target/coverage/orion-windows.json
          cargo llvm-cov report --html --output-dir target/coverage/orion-windows-html
      - name: Rapport de couverture Windows
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-orion-windows
          path: target/coverage
          if-no-files-found: warn
