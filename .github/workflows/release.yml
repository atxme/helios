name: Bundle de release

# Déclenché à la main ou sur un tag. La CI hébergée **ne signe rien** : les
# signatures hybrides Ed25519 + ML-DSA-65 de la gateway restent hors ligne.
# Orion est signé uniquement par le runner Windows interne protégé, avec une
# clé non exportable installée dans son magasin de certificats.
#
# Deux artefacts, deux plateformes de fabrication : le bundle gateway se
# construit sous Linux, l'installateur Orion sous Windows, parce que le
# bundling MSI et l'édition de liens MSVC n'y ont pas d'équivalent
# croisé. Aucun des deux ne demande quoi que ce soit à l'utilisateur final.
#
# Les deux jobs restent **indépendants** — aucun `needs` — donc parallèles :
# la durée du workflow est celle du plus long, pas leur somme. Windows est
# déclaré en premier parce que c'est ce plus long (toolchain MSVC, `npm ci`,
# téléchargement de WireGuardNT, bundling WiX) et que l'ordonnanceur suit
# l'ordre de déclaration quand les exécutants ne sont pas tous disponibles
# d'un coup : le chemin critique démarre alors le premier au lieu d'attendre
# que Linux ait pris sa place.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orion-windows:
    name: Installateur Orion signé (Windows)
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    environment: orion-signing
    env:
      ORION_SIGNING_CERT_SHA1: ${{ vars.ORION_SIGNING_CERT_SHA1 }}
      ORION_TIMESTAMP_URL: ${{ vars.ORION_TIMESTAMP_URL }}
    # Le bundling MSI et l'édition de liens MSVC n'existent que sur
    # Windows : ce job est la seule façon de produire un installateur Orion
    # sans machine Windows manuelle.
    runs-on: [self-hosted, windows, x64, orion-signing]
    steps:
      - uses: actions/checkout@v4

      # Le runner est une station de signature, pas une machine jetable. Rust
      # stable, Node 24, le SDK Windows et signtool y sont préinstallés ; ne pas
      # télécharger de code d'action tiers dans le contexte qui détient la clé.
      # `cargo +stable` ci-dessous rend cette exception explicite : le workflow
      # de validation utilise le MSRV épinglé, tandis que cette station conserve
      # sa toolchain stable préinstallée.

      - name: Prérequis de la station de signature
        shell: pwsh
        run: |
          if ($env:ORION_SIGNING_CERT_SHA1 -notmatch '^[0-9A-Fa-f]{40}$') {
            throw "La variable ORION_SIGNING_CERT_SHA1 est absente ou invalide."
          }
          if ([string]::IsNullOrWhiteSpace($env:ORION_TIMESTAMP_URL)) {
            throw "La variable ORION_TIMESTAMP_URL est absente ou invalide."
          }
          $timestamp = [System.Uri]$env:ORION_TIMESTAMP_URL
          if (-not $timestamp.IsAbsoluteUri -or $timestamp.Scheme -notin @("http", "https")) {
            throw "La variable ORION_TIMESTAMP_URL est invalide."
          }
          $certificate = Get-Item "Cert:\CurrentUser\My\$env:ORION_SIGNING_CERT_SHA1" -ErrorAction Stop
          if (-not $certificate.HasPrivateKey) {
            throw "Le certificat Authenticode attendu n'a pas de clé privée."
          }
          $configuredSignTool = -not [string]::IsNullOrWhiteSpace($env:TAURI_WINDOWS_SIGNTOOL_PATH) -and
            (Test-Path -LiteralPath $env:TAURI_WINDOWS_SIGNTOOL_PATH -PathType Leaf)
          if (-not (Get-Command signtool.exe -ErrorAction SilentlyContinue) -and -not $configuredSignTool) {
            throw "signtool.exe est introuvable."
          }

      # Orion dépend d'`aether`, dont le build script refuse le trousseau de
      # développement en profil release. Un installateur se construit donc avec
      # la même ancre publique que la gateway — sans elle, le build échoue.
      - name: Ancre de confiance éditeur
        shell: pwsh
        env:
          KEYRING: ${{ vars.HELIOS_PUBLISHER_KEYRING }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEYRING)) {
            Write-Output "::error::La variable de dépôt HELIOS_PUBLISHER_KEYRING est absente. Y placer le contenu du trousseau PUBLIC de production."
            exit 1
          }
          $path = Join-Path $env:RUNNER_TEMP "publisher-keyring.json"
          [System.IO.File]::WriteAllText($path, $env:KEYRING)
          if (Select-String -Path $path -Pattern "private" -Quiet) {
            Write-Output "::error::Le trousseau fourni semble contenir une clé privée. Abandon."
            exit 1
          }

      # `cargo xtask orion-msi` télécharge WireGuardNT et vérifie son empreinte
      # épinglée avant d'appeler Tauri. La DLL entre dans l'installateur :
      # l'utilisateur final ne télécharge jamais rien. Le `beforeBuildCommand`
      # de Tauri sait qu'elle est déjà là (`ORION_DEPS_READY`) et ne rappelle
      # pas `cargo` — sous Windows, relier `xtask.exe` pendant qu'il tourne est
      # refusé par le système.
      #
      # Les features passent par `cargo xtask orion-msi`, qui les tient en un
      # seul endroit (`ORION_FEATURES`) : une CI et un poste de build qui les
      # énuméreraient chacun de leur côté finiraient par diverger, et la
      # divergence ne se verrait qu'à l'usage — un installateur qui refuse un
      # profil négociant, sans rien dire du drapeau manquant.
      - name: Construction de l'installateur signé
        env:
          HELIOS_PUBLISHER_KEYRING_PATH: ${{ runner.temp }}/publisher-keyring.json
        run: cargo +stable xtask orion-msi

      - name: Vérification Authenticode et empreintes
        shell: pwsh
        run: |
          $bundle = "target/release/bundle"
          $artifacts = @(Get-ChildItem -Path $bundle -Recurse -Filter *.msi)
          if ($artifacts.Count -eq 0) {
            Write-Output "::error::Aucun MSI produit."
            exit 1
          }

          $expected = $env:ORION_SIGNING_CERT_SHA1.Replace(" ", "").ToUpperInvariant()
          $invalid = $artifacts | Where-Object {
            $signature = Get-AuthenticodeSignature -LiteralPath $_.FullName
            $actual = if ($null -ne $signature.SignerCertificate) {
              $signature.SignerCertificate.Thumbprint
            } else {
              $null
            }
            $signature.Status -ne "Valid" -or
              $null -eq $signature.TimeStamperCertificate -or
              $actual -ne $expected
          }
          if ($invalid) {
            Write-Output "::error::MSI absent, mal signé, non horodaté ou signé par un certificat inattendu : $($invalid.Name -join ', ')"
            exit 1
          }

          $artifacts |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path -Leaf $_.Path) } |
            Tee-Object -FilePath (Join-Path $bundle "SHA256SUMS")

      - uses: actions/upload-artifact@v4
        with:
          name: installateur-orion-windows-signe
          path: |
            target/release/bundle/msi/
            target/release/bundle/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  bundle:
    name: Assemblage du bundle gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Dépendances système des features matérielles
        run: |
          sudo apt-get update
          sudo apt-get install --yes libnftnl-dev libmnl-dev libtss2-dev libudev-dev

      # Le trousseau **public** de l'éditeur n'est pas un secret : c'est l'ancre
      # de confiance compilée dans le binaire. Il est fourni en variable de
      # dépôt, pas en secret, pour que ce fait reste visible.
      - name: Ancre de confiance éditeur
        env:
          KEYRING: ${{ vars.HELIOS_PUBLISHER_KEYRING }}
        run: |
          if [ -z "$KEYRING" ]; then
            echo "::error::La variable de dépôt HELIOS_PUBLISHER_KEYRING est absente." \
                 "Y placer le contenu du trousseau PUBLIC de production" \
                 "(publisher-keyring.json). Aucune clé privée ne doit y figurer."
            exit 1
          fi
          printf '%s' "$KEYRING" > "$RUNNER_TEMP/publisher-keyring.json"
          if grep -qi 'private' "$RUNNER_TEMP/publisher-keyring.json"; then
            echo "::error::Le trousseau fourni semble contenir une clé privée. Abandon."
            exit 1
          fi

      - name: Assemblage
        env:
          HELIOS_PUBLISHER_KEYRING_PATH: ${{ runner.temp }}/publisher-keyring.json
        run: cargo xtask bundle

      - name: Empreintes
        run: |
          cd target/bundle
          dir="$(ls)"
          cd "$dir"
          find . -type f -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS
          cat ../SHA256SUMS

      # Artefacts **non signés** : à télécharger sur le poste éditeur, signer
      # avec `helios-publisher bundle`, puis archiver avec `cargo xtask pack`.
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-gateway
          path: |
            target/bundle/
          if-no-files-found: error
          retention-days: 14
