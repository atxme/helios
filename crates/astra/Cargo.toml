[package]
name = "astra"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Astra : coordinateur de la PKI de négociation v5 (ADR-008). Registre, audit chaîné, émetteur délégué borné, statuts signés et campagnes. Co-implanté avec la gateway, dans un conteneur séparé."

[[bin]]
name = "astra"
path = "src/main.rs"

[dependencies]
aether = { workspace = true, features = ["key-negotiation-signing"] }
anyhow.workspace = true
async-trait.workspace = true
aws-lc-rs.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
rcgen.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile = "3"
