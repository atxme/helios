[package]
name = "astra"
version = "1.4.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Astra : coordinateur de la PKI de négociation v5 (ADR-008). Registre, audit chaîné, émetteur délégué borné, statuts signés et campagnes. Co-implanté avec la gateway, dans un conteneur séparé."

[[bin]]
name = "astra"
path = "src/main.rs"

[dependencies]
aether = { workspace = true, features = ["key-negotiation-signing"] }
# Conteneur AEAD unique du dépôt (ADR-006) : le coffre d'autorité en empile
# trois — un par key-slot, plus le corps — au lieu d'inventer un format.
# Les deux bouts du canal privé Astra–Helios (ROTATION-CERTIFICATS §8.3) sont
# définis dans `astra-channel`, et Astra en consomme les deux : la moitié
# cliente pour appeler la gateway, et la moitié serveur pour son propre listener
# privé (`server_config` et `serve`). Une seule définition des deux bouts : une
# seconde copie du vérificateur épinglé, de l'ALPN et du plancher de version
# serait l'endroit exact où « la reprise est refusée » devient vrai d'un côté et
# faux de l'autre.
astra-channel.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
# Le socket local de la porte (`door::local`) et la console qui l'appelle
# (`src/console.rs`) : HTTP/1 sur un flux Unix, comme le socket local
# d'administration de `helios-api`.
hyper.workspace = true
hyper-util.workspace = true
rcgen.workspace = true
# La configuration TLS du listener privé. Le type traverse l'API de
# `astra-channel`, qui la construit ; `astra` doit pouvoir la nommer
# pour la porter jusqu'au serveur.
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile = "3"
# Le canal privé s'éprouve de bout en bout sur la boucle locale : listener
# `astra-channel` d'un côté, client `astra::gateway` de l'autre, un vrai
# handshake mTLS entre les deux.
async-trait.workspace = true
axum.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
# Les tests d'intégration du binaire lancent `astra` comme le fait un
# opérateur, et fabriquent le matériel d'entrée (clé publique `CA-PQ`) avec les
# mêmes types que la production.
aether = { workspace = true, features = ["key-negotiation-signing"] }
# Conteneur AEAD unique du dépôt (ADR-006) : le coffre d'autorité en empile
# trois — un par key-slot, plus le corps — au lieu d'inventer un format.
