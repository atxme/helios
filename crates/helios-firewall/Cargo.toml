[package]
name = "helios-firewall"
version = "0.6.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# Active le backend Netlink réel (rustables). rustables parle Netlink en Rust
# pur ; sa génération de bindings requiert libclang et les headers noyau.
# L'exécution requiert un kernel avec nf_tables — donc la cible, pas WSL2.
netlink = ["dep:rustables"]

[dependencies]
aether.workspace = true
async-trait.workspace = true
tracing.workspace = true
rustables = { version = "0.8", optional = true }
# Version alignée sur celle qu'expose rustables dans ses signatures.
ipnetwork = "0.21"

[dev-dependencies]
toml.workspace = true
# `FirewallBackend` is async, so its tests need an executor.
tokio = { workspace = true, features = ["macros", "rt"] }
