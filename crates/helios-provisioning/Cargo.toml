[package]
name = "helios-provisioning"
version = "0.3.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Enrôlement des clients Orion côté gateway Helios : IPAM CGNAT déterministe sans état, échange ML-KEM, injection du PSK WireGuard. Testable sur WSL2."

[dependencies]
aether = { workspace = true }
blake3.workspace = true
base64.workspace = true
zeroize.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
default = []
# Signature ML-DSA-87 des objets de cycle de vie : réservée aux tests et aux
# chemins opérateur. Une gateway qui ne fait que vérifier ne lie aucune
# implémentation de signature.
certificate-signing = ["aether/key-negotiation-signing"]

[dev-dependencies]
tempfile = "3"
