[package]
name = "helios-api"
version = "0.3.1"
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# Embarque l'app React dans le binaire (prod). Nécessite d'avoir exécuté
# `npm run build` dans web/ au préalable.
embed-ui = ["dep:rust-embed"]

[dependencies]
aether.workspace = true
helios-firewall.workspace = true
x25519-dalek = { workspace = true }
base64.workspace = true
helios-wireguard.workspace = true
helios-provisioning.workspace = true
helios-update.workspace = true
axum = { workspace = true }
tokio = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
async-trait = { workspace = true }
mime_guess.workspace = true
rust-embed = { version = "8", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
futures-util.workspace = true
tokio-tungstenite = "0.24"
