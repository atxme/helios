[package]
name = "helios-api"
version = "0.5.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# Embarque l'app React dans le binaire (prod). Nécessite d'avoir exécuté
# `npm run build` dans web/ au préalable.
embed-ui = ["dep:rust-embed"]

[dependencies]
aether.workspace = true
helios-firewall.workspace = true
x25519-dalek = { workspace = true }
base64.workspace = true
helios-wireguard.workspace = true
helios-provisioning.workspace = true
helios-update.workspace = true
axum = { workspace = true }
tokio = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
async-trait = { workspace = true }
futures-util.workspace = true
mime_guess.workspace = true
rust-embed = { version = "8", optional = true }
# Canal privé Astra–Helios (ROTATION-CERTIFICATS §8.3). Le lien est monté à la
# main : le transport y est le contrat — TLS 1.3 seul, ALPN épinglée, ni ticket
# ni 0-RTT — et un client généraliste qui réécrit `alpn_protocols` selon ses
# préférences HTTP casserait cette borne sans prévenir.
rustls.workspace = true
tokio-rustls.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.24"
# Identités de transport jetables pour les essais du canal privé, fabriquées
# comme les fabriquent `heliosd init-astra-channel` et `astra init-channel`.
rcgen.workspace = true
time.workspace = true
