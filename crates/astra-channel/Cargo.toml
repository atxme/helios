[package]
name = "astra-channel"
version = "1.1.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Canal privé Astra–Helios sur le veth : contrats, bornes mTLS/ALPN, client et serveur de l'API privée de cycle de vie (ROTATION-CERTIFICATS §8.3, §16)."

[dependencies]
# Les contrats échangés sur le canal vivent dans `aether` ; cette caisse n'en
# dépend que de lui, pour qu'Astra puisse parler au veth sans lier la façade
# HTTP de la gateway (CRATE-REORGANIZATION §7).
aether.workspace = true
async-trait = { workspace = true }
axum = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
tracing.workspace = true
# Le lien est monté à la main : le transport y est le contrat — TLS 1.3 seul,
# ALPN épinglée, ni ticket ni 0-RTT — et un client généraliste qui réécrit
# `alpn_protocols` selon ses préférences HTTP casserait cette borne sans
# prévenir.
rustls.workspace = true
tokio-rustls.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# Identités de transport jetables pour les essais du canal, fabriquées comme
# les fabriquent `heliosd init-astra-channel` et `astra init-channel`.
rcgen.workspace = true
time.workspace = true
