[package]
name = "aether-key-negotiation"
version = "2.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Authenticated QUIC transport for pre-WireGuard key negotiation."

[dependencies]
aether = { workspace = true, features = ["key-negotiation-signing"] }
quinn.workspace = true
rustls.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Keep this proc-macro dependency explicit: the crate uses `#[async_trait]` in
# its public trait boundary, and a standalone Windows check must not lose it
# while resolving workspace-inherited dependencies.
async-trait = "0.1"
aws-lc-rs.workspace = true
tracing.workspace = true
hex.workspace = true
base64.workspace = true
zeroize.workspace = true

[dev-dependencies]
rcgen.workspace = true
