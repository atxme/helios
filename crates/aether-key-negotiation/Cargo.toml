[package]
name = "aether-key-negotiation"
version = "2.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Authenticated QUIC transport for pre-WireGuard key negotiation."

[dependencies]
aether = { workspace = true, features = ["key-negotiation-signing"] }
quinn.workspace = true
rustls.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Keep this proc-macro dependency explicit: the crate uses `#[async_trait]` in
# its public trait boundary, and a standalone Windows check must not lose it
# while resolving workspace-inherited dependencies.
async-trait = "0.1"
aws-lc-rs.workspace = true
tracing.workspace = true
hex.workspace = true
base64.workspace = true
zeroize.workspace = true
# Socket `[::]` dual-stack de l'écoute de négociation : `IPV6_V6ONLY` doit être
# posé avant `bind`, ce que `std` ne permet pas. Déjà présente transitivement
# via quinn et quinn-udp : aucun coût supplémentaire de chaîne
# d'approvisionnement.
socket2 = "0.6"

# `EAFNOSUPPORT`, seule erreur qui ramène l'écoute à IPv4 au lieu de la faire
# échouer. Déjà présente transitivement via tokio et quinn-udp.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rcgen.workspace = true
