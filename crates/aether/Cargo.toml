[package]
name = "aether"
version = "1.6.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Le milieu partagé entre Helios (la gateway) et Orion (le client) : machine à états du tunnel, politiques de pare-feu, types communs. Zéro dépendance système."

[features]
default = []
# API de génération et de signature réservée à l'outil éditeur hors gateway.
publisher-signing = ["fips204/default-rng"]
# Runtime ML-DSA signing for authenticated key negotiation.
key-negotiation-signing = ["fips204/default-rng", "dep:rcgen"]

[dependencies]
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
aws-lc-rs.workspace = true
zeroize.workspace = true
base64.workspace = true
hex.workspace = true
serde_json.workspace = true
fips204.workspace = true
curve25519-dalek.workspace = true
# Contrôles X.509 du cycle de vie des certificats : CA réelle, usage
# `clientAuth`, chaîne vers une ancre déjà détenue et liaison CSR ↔ clé
# certifiée. `verify` apporte la vérification de signature ; le crate est déjà
# dans l'arbre via rcgen.
x509-parser = { version = "0.16", features = ["verify"] }
# Émission X.509 : seulement pour `test_x509`, le matériel de test partagé par
# les crates qui vérifient des chaînes clientes. Une gateway qui ne fait que
# vérifier n'active pas la feature et ne lie pas rcgen.
rcgen = { workspace = true, optional = true }
# Clés Curve25519 du plan de données WireGuard (`wg`) : `StaticSecret` porte la
# clé privée persistée d'un pair, par opposition aux clés éphémères.
x25519-dalek.workspace = true
# `sync` seul : aether ne tire aucun runtime, uniquement le `oneshot` qui porte
# l'acquittement d'installation du PSK (voir `events::InstallPskRequest`).
tokio = { workspace = true, features = ["sync"] }

[build-dependencies]
base64.workspace = true
serde_json.workspace = true

[dev-dependencies]

# `mlock` / `VirtualLock` : empêche un secret d'atteindre le fichier d'échange
# ou celui d'hibernation, que `zeroize` ne peut pas nettoyer (ADR-006 §5).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Memory"] }
