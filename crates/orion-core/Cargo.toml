[package]
name = "orion-core"
version = "2.0.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Logique du client VPN Orion (config, backend WireGuard, provisioning et télémétrie) — testable sans dépendance Tauri."

[dependencies]
# `key-negotiation-signing` n'est pas négociable ici : sans elle, un Orion
# compilerait en refusant à l'exécution les profils qui épinglent un
# certificat — un binaire d'apparence normale qui échoue avant WireGuard.
aether = { workspace = true, features = ["key-negotiation-signing"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
futures-util.workspace = true
bytes.workspace = true
# The parsed URL's `Host` type. `reqwest` re-exports `Url` but not this type,
# and distinguishing an IP literal from a name must use the exact structure
# consumed by the HTTP client, never a second parse of the source string.
url = "2"
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
directories = "5"
base64.workspace = true
aws-lc-rs.workspace = true
zeroize.workspace = true
# Dérive la clé publique Curve25519 depuis la clé privée du profil. On la
# recalcule plutôt que de la stocker : une clé publique stockée pourrait diverger
# de la clé privée réellement utilisée, et l'identité annoncée à la gateway ne
# correspondrait plus au tunnel monté.
x25519-dalek = { workspace = true }
defguard_wireguard_rs = { workspace = true, optional = true }
# Non optionnelle : voir la note sur `aether` ci-dessus.
helios-key-negotiation = { workspace = true }
# Conteneur AEAD partagé des secrets au repos (ADR-006 §2).
helios-vault = { workspace = true }
# La frontière matérielle FIDO2 et la **seule** cérémonie qui n'ouvre aucun
# coffre (§14.1). Orion ne lie ni `astra` ni le format de coffre : la caisse
# est extraite précisément pour que ce chemin-là soit le seul qu'il ait.
helios-fido = { workspace = true }
# Normalisation NFC de la passphrase `nomade` : sans elle, la même phrase
# saisie sur deux systèmes dérive deux clés différentes (ADR-006 §3).
unicode-normalization = "0.1"

# Épinglage de la socket de négociation hors tunnel (`net_pin`). Pas plus
# optionnel que le reste de la négociation : sans lui, la session QUIC change
# d'interface quand WireGuard capte la route, et la confirmation se perd.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  # Épinglage de la socket de négociation hors tunnel (`net_pin`).
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  # Couches plateforme du coffre (ADR-006 §3) : clé TPM non exportable via CNG,
  # enveloppe DPAPI, et boîte de saisie native de la passphrase `nomade`.
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  # `GetCurrentProcess`, pour comparer le propriétaire de la clé TPM au compte
  # qui l'utilise (vérification d'ACL, ADR-006 §3).
  "Win32_System_Threading",
  # `CREDUI_INFOW` porte un `HBITMAP` : sans GDI, la structure est absente.
  "Win32_Graphics_Gdi",
  # `WerRegisterExcludedMemoryBlock` : exclusion des pages secrètes des
  # rapports d'erreur Windows (ADR-006 §5).
  "Win32_System_ErrorReporting",
] }
# WMI (posture BitLocker) : `windows-sys` n'expose aucune interface COM, seul
# le crate `windows` le fait. Il est déjà présent dans le lockfile.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Rpc",
  "Win32_System_Variant",
  "Win32_System_Wmi",
  # `VARIANT` n'existe qu'avec Com **et** Ole.
  "Win32_System_Ole",
] }

[features]
default = []
# Backend WireGuard réel via `defguard_wireguard_rs` (noyau Linux/Windows, ou
# userspace BoringTun). Compile partout, mais ne peut être *exercé* que sur une
# machine disposant du plan de données WireGuard — comme la feature `netlink`
# côté heliosd. Les anciens backends IKEv2 ont été supprimés avec la bascule.
wireguard = ["dep:defguard_wireguard_rs"]
# Signature ML-DSA-87 des objets de cycle de vie, pour les tests du magasin de
# confiance. Un Orion livré ne signe aucun objet d'autorité : il en vérifie.
certificate-signing = ["aether/key-negotiation-signing"]

[dev-dependencies]
tempfile = "3"
# Fixtures only. The renewal path is tested against a **real** CA-TLS issuing a
# **real** leaf from the CSR the client produced: a grant carrying a hand-made
# certificate would pass the checks that matter — the CSR binding above all —
# without ever proving them.
rcgen = { workspace = true }
# `CertificateParams::not_before` is an `OffsetDateTime`; rcgen exposes the type
# without re-exporting the crate that defines it.
time = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }
