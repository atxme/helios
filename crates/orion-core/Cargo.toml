[package]
name = "orion-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Logique du client VPN Orion (config, backend WireGuard, provisioning et télémétrie) — testable sans dépendance Tauri."

[dependencies]
aether = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
directories = "5"
base64.workspace = true
aws-lc-rs.workspace = true
# Dérive la clé publique Curve25519 depuis la clé privée du profil. On la
# recalcule plutôt que de la stocker : une clé publique stockée pourrait diverger
# de la clé privée réellement utilisée, et l'identité annoncée à la gateway ne
# correspondrait plus au tunnel monté.
x25519-dalek = { workspace = true }
defguard_wireguard_rs = { workspace = true, optional = true }

[features]
default = []
# Backend WireGuard réel via `defguard_wireguard_rs` (noyau Linux/Windows, ou
# userspace BoringTun). Compile partout, mais ne peut être *exercé* que sur une
# machine disposant du plan de données WireGuard — comme la feature `netlink`
# côté heliosd. Les anciens backends IKEv2 ont été supprimés avec la bascule.
wireguard = ["dep:defguard_wireguard_rs"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }
