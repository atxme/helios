[package]
name = "orion-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Logique du client VPN Orion (config, backend IKEv2, télémétrie) — testable sur WSL2, sans dépendance Tauri."

[dependencies]
aether = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
directories = "5"
defguard_wireguard_rs = { workspace = true, optional = true }

[features]
default = []
# Backend WireGuard réel via `defguard_wireguard_rs` (noyau Linux/Windows, ou
# userspace BoringTun). Compile partout, mais ne peut être *exercé* que sur une
# machine disposant du plan de données WireGuard — comme la feature `netlink`
# côté heliosd. Les anciens backends IKEv2 ont été supprimés avec la bascule.
wireguard = ["dep:defguard_wireguard_rs"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }
