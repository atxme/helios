[package]
name = "heliosd"
version = "1.12.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "heliosd"
path = "src/main.rs"

[features]
default = []
# Propage l'activation du backend Netlink réel (cible).
netlink = ["helios-firewall/netlink"]
# Backend WireGuard noyau réel (target-only, comme `netlink`).
wireguard = ["helios-wireguard/wireguard"]
# Embarque l'UI React dans le binaire.
embed-ui = ["helios-api/embed-ui"]
# Active la validation TPM réelle via libtss2-esys (cible uniquement, pas WSL2).
tpm = ["helios-tpm/tpm"]

[dependencies]

# `key-negotiation-signing` sans condition : un heliosd qui compile en
# ignorant `key_negotiation_port` laisse la gateway annoncer un service
# qu'elle ne rend pas, et les clients échouent avant WireGuard.
aether = { workspace = true, features = ["key-negotiation-signing"] }
helios-firewall.workspace = true
helios-wireguard.workspace = true
helios-update.workspace = true
helios-api.workspace = true
helios-tpm.workspace = true
helios-escrow.workspace = true
helios-provisioning.workspace = true
tokio = { workspace = true }
clap.workspace = true
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Non optionnelle : voir la note sur `aether` plus bas.
helios-key-negotiation = { workspace = true }
# Conteneur AEAD de la table des PSK statiques (ADR-006 §4).
helios-vault = { workspace = true }
thiserror.workspace = true
aws-lc-rs.workspace = true
zeroize.workspace = true
rcgen = { workspace = true }
rustls = { workspace = true }
time = { workspace = true }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
# The gateway does not depend on the client — but their interoperability has to
# be proven somewhere, and the only honest place is against the real client
# code. `orion-core` is therefore a **test-only** dependency, and it proves two
# things no unit test on either side can show: that both ends derive the same
# PSK (`key_negotiation.rs`), and that the enrolment block this gateway serves
# is one Orion accepts (`certificates.rs`).
orion-core = { workspace = true }
rcgen = { workspace = true }

# `prctl(PR_SET_DUMPABLE, 0)` avant le chargement de la première clé
# (ADR-006 §6). Déjà présente transitivement via tokio : aucun coût
# supplémentaire de chaîne d'approvisionnement.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
