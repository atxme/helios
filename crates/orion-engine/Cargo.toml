[package]
name = "orion-engine"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Channel between the privileged Orion engine and its unprivileged UI: bounded JSON-line frame protocol."

[dependencies]
# Frames carry client-core events to the UI; the same type serves both sides,
# so there is no second set of types to keep in sync.
orion-core = { path = "../orion-core" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
# The engine's controller is a trait object behind `serve`; the macro is the workspace's.
async-trait.workspace = true
# Session token: 256 bits from the repository's one randomness entry point.
aether.workspace = true
# The token is wiped on drop, not only freed.
zeroize.workspace = true
# The engine logs its start-up exactly as the shell did.
tracing.workspace = true

[dev-dependencies]
# `tokio::time::pause` for the hello timeout test.
tokio = { workspace = true, features = ["test-util"] }

# Named pipe: DACL and SID conversion (Security::Authorization), client and
# server process ids (System::Pipes), process image and times (System::Threading),
# token user (Security), and the handles and LocalFree (Foundation).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
