[package]
name = "orion-engine"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Canal entre le moteur privilégié d'Orion et son IHM non élevée : protocole de trames JSON par ligne, borné en taille."

[dependencies]
# Les trames transportent des événements du cœur client vers l'IHM ; le même
# type sert des deux côtés, sans second jeu de types à garder synchrone.
orion-core = { path = "../orion-core" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
