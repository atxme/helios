[package]
name = "helios-client-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Logique du client VPN Helios (config, backend IKEv2, télémétrie) — testable sur WSL2, sans dépendance Tauri."

[dependencies]
helios-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
directories = "5"

[features]
default = []
# Backends IPsec réels — spécifiques à la plateforme, validables uniquement sur cible.
# Comme la feature `netlink` côté heliosd : non compilés par défaut.
linux-strongswan = []
native-windows = []
native-macos = []

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }
