[workspace]
resolver = "2"
members = [
    "crates/*",
    "tools/*",
    "apps/orion/src-tauri",
]

# `apps/orion/src-tauri` est dans le build par défaut : le client DOIT être
# compilé à chaque `cargo build`/`cargo test`, sinon une casse du shell Tauri
# dort sans être vue (c'est exactement ce qui est arrivé pendant la bascule
# WireGuard). Il lie le webview natif — sous Linux `webkit2gtk-4.1`, installé par
# `scripts/setup-dev.sh` ; sous Windows, la cible réelle d'Orion, c'est WebView2
# et il n'y a aucune dépendance GTK.
default-members = [
    "crates/aether",
    "crates/astra",
    "crates/astra-operator",
    "crates/astra-channel",
    "crates/helios-firewall",
    "crates/helios-update",
    "crates/helios-api",
    "crates/helios-tpm",
    "crates/helios-escrow",
    "crates/helios-provisioning",
    "crates/helios-wireguard",
    "crates/aether-key-negotiation",
    "crates/aether-vault",
    "crates/aether-fido",
    "crates/orion-core",
    "crates/heliosd",
    "tools/astra-signer",
    "tools/helios-astra-helper",
    "tools/helios",
    "tools/helios-installer",
    "tools/xtask",
    "apps/orion/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Christophe Benedetti <christophe.benedetti15@gmail.com>"]
repository = "https://github.com/christophe/helios"
rust-version = "1.88"

[workspace.dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "sync",
    "signal",
    "process",
    "fs",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "std"] }
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "aws_lc_rs", "std", "tls12"] }
# `aws_lc_rs` plutôt que le défaut `ring` : rcgen tire ses **clés privées X.509**
# de son fournisseur, et par défaut c'est le CSPRNG de `ring` — un second
# générateur, à côté de celui que NEGOCIATION-DE-CLE-V5 §4.3 impose. Ce réglage
# met CA-TLS, les leafs clientes, le matériel de l'émetteur délégué Astra et les
# fixtures de test sur le même CTR-DRBG que le reste du protocole. Sans effet
# sur `rustls`/`quinn`, dont le fournisseur reste `ring` : voir la « Limite
# connue » de `aether::random`.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "aws_lc_rs", "x509-parser"] }
# Canal privé Astra–Helios (ROTATION-CERTIFICATS §8.3). Le lien est monté à la
# main plutôt que par `reqwest` : le transport y est le contrat — TLS 1.3 seul,
# ALPN épinglée, ni ticket ni 0-RTT — et un client généraliste qui réécrit
# `alpn_protocols` selon ses préférences HTTP casserait cette borne sans
# prévenir. Déjà toutes présentes dans le lock via reqwest. La feature `tls12`
# n'est **pas** demandée ici : `helios-api::internal` retire les suites 1.2 du
# fournisseur lui-même, et un manifeste qui réclamerait ce que le canal refuse
# se lirait comme une permission.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
http-body-util = "0.1"
time = "0.3"
futures-util = "0.3"
bytes = "1"
netlink-sys = { version = "0.8", features = ["tokio_socket"] }
# Backend crypto : AWS-LC (aws-lc-sys), non-FIPS → statique, builder `cc`, aucune
# toolchain CMake/Go/Ninja ni bindgen (bindings pré-générés). ML-KEM-768 (FIPS 203)
# est dans l'API `kem` standard. `prebuilt-nasm` évite NASM sur Windows x86-64.
# C'est aussi le **générateur d'aléa** de la négociation v5 et du cycle de vie
# (`aether::random`) : `SystemRandom` y expose le CTR-DRBG-AES-256 sans fonction
# de dérivation, à état par thread, reseedé toutes les 4096
# générations et réinstancié après fork ou reprise d'instantané. La construction
# `fips` (aws-lc-fips-sys, certificats CAVP/CMVP) reste hors périmètre : elle
# exige les chaînes CMake et Go qu'ADR-001 §2 tient hors du build, pour le même
# mécanisme.
aws-lc-rs = { version = "1.18.1", features = ["prebuilt-nasm"] }
aws-lc-sys = "0.45.0"
# ML-DSA (FIPS 204), épinglé après lecture de la source 0.4.6. Le RNG par défaut
# reste désactivé côté vérification.
#
# **Les deux jeux de paramètres sont nécessaires, et l'un ne remplace pas
# l'autre** : `ml-dsa-65` porte les signatures d'artefacts éditeur d'ADR-002
# (`aether::sig`, `REQUIRED_ALGS`, trousseau compilé), `ml-dsa-87` porte la PKI
# de négociation de clé v5 (ADR-005, amendement du 6 août 2026). Remplacer le
# premier par le second invaliderait la vérification de toutes les releases
# déjà signées.
fips204 = { version = "=0.4.6", default-features = false, features = ["ml-dsa-65", "ml-dsa-87"] }
# Précontrôles Ed25519 stricts (points faibles + scalaires canoniques) avant AWS-LC.
# Déjà présent transitivement via x25519-dalek ; ce n'est pas un backend de signature.
curve25519-dalek = "4"
blake3 = "1"
zeroize = "1"
base64 = "0.22"
hex = "0.4"
# Saisie du PIN FIDO2 sans écho. Un PIN d'authentificateur affiché dans un
# terminal se retrouve dans un scrollback, une capture d'écran ou un partage.
rpassword = "7"
# `static_secrets` expose `StaticSecret` : une clé privée persistée (celle du
# profil WireGuard), par opposition aux clés éphémères par défaut.
x25519-dalek = { version = "2", features = ["static_secrets"] }
# Backend WireGuard unifié (noyau Linux via netlink, Windows, ou userspace
# BoringTun) derrière une seule API. Optionnel : activé par la feature
# `wireguard` d'orion-core / heliosd.
defguard_wireguard_rs = "0.11"

aether = { path = "crates/aether" }
astra = { path = "crates/astra" }
astra-operator = { path = "crates/astra-operator" }
astra-channel = { path = "crates/astra-channel" }
helios-astra-helper = { path = "tools/helios-astra-helper" }
helios-provisioning = { path = "crates/helios-provisioning" }
helios-wireguard = { path = "crates/helios-wireguard" }
aether-key-negotiation = { path = "crates/aether-key-negotiation" }
aether-vault = { path = "crates/aether-vault" }
aether-fido = { path = "crates/aether-fido" }
helios-api = { path = "crates/helios-api" }
helios-firewall = { path = "crates/helios-firewall" }
helios-update = { path = "crates/helios-update" }
helios-escrow = { path = "crates/helios-escrow" }
helios-tpm = { path = "crates/helios-tpm" }
orion-core = { path = "crates/orion-core" }

[profile.release]
lto = "thin"
strip = true

# Le lien d'Orion en debug sous Windows/MSVC dépassait la limite de 4 Gio du
# PDB (LNK1140) : le fichier agrège les infos de débogage de tout le graphe —
# `windows-*` et leurs types générés, le C d'`aws-lc-sys`, tauri/wry/tao.
# Les dépendances sont donc compilées sans infos de débogage ; les crates de
# l'espace de travail gardent le debug complet du profil `dev`, donc le
# pas-à-pas et les backtraces du code Helios/Orion restent intacts. Seul le
# pas-à-pas *dans la source d'une dépendance* est perdu.
[profile.dev.package."*"]
debug = false
