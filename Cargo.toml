[workspace]
resolver = "2"
members = [
    "crates/helios-core",
    "crates/helios-vici",
    "crates/helios-firewall",
    "crates/helios-update",
    "crates/helios-api",
    "crates/helio-tpm",
    "crates/helios-client-core",
    "crates/heliosd",
    "tools/helios-ctl",
    "apps/helios-client/src-tauri",
]

# Le shell Tauri du client (apps/helios-client/src-tauri) lie webkit2gtk : il ne
# compile PAS sur WSL2. On l'exclut donc du build par défaut — exactement comme la
# feature `netlink` est target-only — pour que `cargo build`/`cargo test` (sans
# `-p`) restent verts partout. Le construire est explicite : `cargo build -p helios-client`.
default-members = [
    "crates/helios-core",
    "crates/helios-vici",
    "crates/helios-firewall",
    "crates/helios-update",
    "crates/helios-api",
    "crates/helio-tpm",
    "crates/helios-client-core",
    "crates/heliosd",
    "tools/helios-ctl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Christophe Benedetti <christophe.benedetti15@gmail.com>"]
repository = "https://github.com/christophe/helios"
rust-version = "1.82"

[workspace.dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "sync",
    "signal",
    "process",
    "fs",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
netlink-sys = { version = "0.8", features = ["tokio_socket"] }

helios-core = { path = "crates/helios-core" }
helios-api = { path = "crates/helios-api" }
helios-vici = { path = "crates/helios-vici" }
helios-firewall = { path = "crates/helios-firewall" }
helios-update = { path = "crates/helios-update" }
helio-tpm = { path = "crates/helio-tpm" }

[profile.release]
lto = "thin"
strip = true
