[workspace]
resolver = "2"
members = [
    "crates/aether",
    "crates/helios-firewall",
    "crates/helios-update",
    "crates/helios-api",
    "crates/helio-tpm",
    "crates/helios-provisioning",
    "crates/orion-core",
    "crates/heliosd",
    "tools/helios-ctl",
    "apps/orion/src-tauri",
]

# Le shell Tauri du client (apps/orion/src-tauri) lie webkit2gtk : il ne
# compile PAS sur WSL2. On l'exclut donc du build par défaut — exactement comme la
# feature `netlink` est target-only — pour que `cargo build`/`cargo test` (sans
# `-p`) restent verts partout. Le construire est explicite : `cargo build -p orion`.
default-members = [
    "crates/aether",
    "crates/helios-firewall",
    "crates/helios-update",
    "crates/helios-api",
    "crates/helio-tpm",
    "crates/helios-provisioning",
    "crates/orion-core",
    "crates/heliosd",
    "tools/helios-ctl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Christophe Benedetti <christophe.benedetti15@gmail.com>"]
repository = "https://github.com/christophe/helios"
rust-version = "1.82"

[workspace.dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "sync",
    "signal",
    "process",
    "fs",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
netlink-sys = { version = "0.8", features = ["tokio_socket"] }
# Backend crypto : AWS-LC (aws-lc-sys), non-FIPS → statique, builder `cc`, aucune
# toolchain CMake/Go/Ninja ni bindgen (bindings pré-générés). ML-KEM-768 (FIPS 203)
# est dans l'API `kem` standard. `prebuilt-nasm` évite NASM sur Windows x86-64.
# La feature `fips` (validation FIPS 140-3) reste activable plus tard sans changer
# le code — voir le trait `Kem` dans aether::pq et ADR-001 §2.
aws-lc-rs = { version = "1.17", features = ["prebuilt-nasm"] }
blake3 = "1"
zeroize = "1"

aether = { path = "crates/aether" }
helios-provisioning = { path = "crates/helios-provisioning" }
helios-api = { path = "crates/helios-api" }
helios-firewall = { path = "crates/helios-firewall" }
helios-update = { path = "crates/helios-update" }
helio-tpm = { path = "crates/helio-tpm" }

[profile.release]
lto = "thin"
strip = true
